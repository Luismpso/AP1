name: AP
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyter
  - ipykernel
  - tqdm
  - requests
  - beautifulsoup4
  - nltk
  - pip
  # - pytorch # CPU
  - pytorch-cuda=12.1 # GPU
  - torchvision
  - torchaudio
  - cpuonly
  - pip:
    - transformers
    - huggingface-hub
    - tokenizers
    - sentencepiece
    - anthropic
    - google-genai
    - openai
    - ollama
    - pyspellchecker
